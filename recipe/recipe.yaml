schema_version: 1

context:
  version: "0.5.2"

package:
  name: qtchecker
  version: ${{ version }}

source:
  url: https://github.com/lavue-org/qtchecker/archive/refs/tags/v${{ version }}.tar.gz
  sha256: bb05d837a6a2e68e6b360b5c1d24d4e8e292c58d677fdd85ab4921116c490724

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - pyqt >=5.15,<6

tests:
  - python:
      imports:
        - qtchecker
        - qtchecker.qtChecker

      python_version:
        - ${{ python_min }}.*
        - "*"


about:
  homepage: https://github.com/lavue-org/qtchecker
  repository: https://github.com/lavue-org/qtchecker
  license: GPL-2.0-only
  license_file: COPYRIGHT
  summary: Qt Checker
  description: |
    Qt Checker is a simple helper module to perform PyQt GUI tests

extra:
  recipe-maintainers:
    - jkotan
